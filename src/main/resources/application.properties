spring.application.name=backend


# ===============================
# CONFIG IMPORT — charge .env.properties depuis la racine du projet
# Ce fichier contient les secrets et N'EST PAS commité dans Git
# ===============================
spring.config.import=optional:file:.env.dev.properties

# ===============================
# DATABASE
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# SERVER
# ===============================
server.port=8081

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# ===============================
# MAIL — Resend (HTTP API)
# ===============================
resend.api-key=${RESEND_API_KEY}
app.mail.from=${MAIL_FROM}

# ===============================
# APP
# ===============================
app.base-url=${APP_BASE_URL}
app.frontend-url=${APP_FRONTEND_URL}
app.website-url=${WEBSITE_URL}
app.upload-dir=uploads

# Destinataire interne des messages du formulaire de contact.
# A defaut, les messages partent sur l'adresse d'expedition.
app.contact.recipient=${CONTACT_RECIPIENT:${app.mail.from}}
app.cookie.secure=${COOKIE_SECURE:true}

# ===============================
# WEB PUSH (VAPID)
# Générer une paire de clés : npx web-push generate-vapid-keys
# Laisser vide désactive proprement le canal push (l'app démarre normalement).
# ===============================
vapid.public-key=${VAPID_PUBLIC_KEY}
vapid.private-key=${VAPID_PRIVATE_KEY}
vapid.subject=${VAPID_SUBJECT}

# true  = affiche l'OTP dans les logs (développement)
# false = envoi réel via SMTP (production)
app.mail.console-mode=${MAIL_CONSOLE_MODE:false}

# ===============================
# FILE UPLOAD
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework.security=DEBUG

# ===============================
# CORS — origines autorisées à appeler /api/** (séparées par des virgules)
# ===============================
app.cors.allowed-origins=${APP_FRONTEND_URL},${WEBSITE_URL}

# ===============================
# COOKIE DE REFRESH TOKEN
# Strict  = frontend et API sur le même domaine enregistrable (recommandé)
# None    = domaines différents ; exige app.cookie.secure=true
# ===============================
app.cookie.same-site=${COOKIE_SAME_SITE:Strict}

# ===============================
# COMPTE ADMINISTRATEUR INITIAL
# Renseigné uniquement au premier démarrage, puis à retirer de la configuration.
# Laisser vide ne crée aucun compte.
# ===============================
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
